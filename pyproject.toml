[project]
name = "parralax-dns"
version = "0.1.0"
description = "Parralax-DNS — inventaire historisé de domaines Infomaniak et Cloudflare"
requires-python = ">=3.14"
dependencies = [
  "SQLAlchemy>=2.1,<3.0",
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "jinja2>=3.1,<4.0",
  "mcp>=2.2,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
  "technitiumdns-api>=0.1.1,<0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
