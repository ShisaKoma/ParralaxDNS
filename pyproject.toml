[project]
name = "parralax-dns"
version = "0.1.0"
description = "Parralax-DNS"
requires-python = ">=3.14"
dependencies = [
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "mcp>=1.30,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
  "technitiumdns-api>=0.1.1,<0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
