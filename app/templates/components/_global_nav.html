<header class="site-header">

      {% include "components/_brand_mark.html" %}
      <span>Parralax-DNS</span>
    </a>
    <div class="site-nav__links">
      <a href="/domains"{% if active_navigation == "domains" %} aria-current="page"{% endif %}>Domaines</a>

        <div class="tools-popover">
          <button type="button" data-open-dialog="schedule-dialog">Planification</button>

          <button type="button" data-open-dialog="setup-dialog">Connecter un serveur</button>

        </div>
